# CNKI Research Portable — an independent agent preset for DSH Desktop.
#
# Installed once through the official `dsh plugin` / `plugin_manager`
# (`install_bundle`) path. Selecting the preset afterwards touches nothing
# global: no profile edit, no HMR reload, no root-scope registration.
#
# Isolation model (verified against @deepseek-ai/dsh-mcp-client 0.2.0-rc.2 and
# @deepseek-ai/dsh-agent-preset-registry):
#   * every row below is a CHILD of this preset declaration, so it activates in
#     the preset's own Cordis scope (`createScope(owner, key)`), never in the
#     root composition;
#   * tool visibility follows the scope chain, so `mcp__cnki__*` exists only in
#     sessions whose `agentPreset` is `cnki-research`;
#   * `serverName` reservations are per scope (`activeServerNames`, WeakMap), so
#     a host-plane MCP row could reuse `cnki` without colliding;
#   * one MCP child process serves every cnki-research session and outlives
#     them; it is disposed only when this declaration is unloaded.
#
# PATH INDEPENDENCE CONTRACT
# --------------------------
# This file contains no absolute path, no user name, no drive letter and no
# machine-specific value. Everything is resolved at entry-activation time:
#
#   * `baseUrl` is the profile directory URL supplied by the Cordis loader; the
#     installed bundle is located through `createRequire(baseUrl)` (pnpm links
#     `@local/dsh-cnki-research` into `<profile>/node_modules`), with a direct
#     `<baseUrl>node_modules/...` fallback.
#   * `<bundle>/portable.runtime.json` — written by `tools/portable.ps1` at
#     install time — names the Python interpreter that owns `cnki-mcp`. It is
#     optional: `<packageRoot>/.venv` and the `CNKI_RESEARCH_PYTHON`
#     environment variable are consulted too, and every expression degrades to
#     a PATH lookup instead of throwing.
#   * `!!js` expressions are evaluated by the Cordis loader (`interpolate`, see
#     @deepseek-ai/cordis-plugin-loader `src/config/utils.ts`); a thrown
#     expression would fail preset activation, so each expression below is
#     total: it is wrapped in try/catch and always returns a string.
#
# Verification: `node tools/tests/check_bundle_paths.mjs` proves the resolved
# values, and `dsh --dump-config` proves the composition parses.
- insert:
    - id: preset-cnki-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cnki-research
        name: CNKI Research
        description: >-
          中国知网（CNKI）文献检索模式。保留 Standard 的全部能力，并额外提供本机
          cnki-mcp 的知网检索工具（easy-search / advanced-search /
          get-info-from-url / get-info-by-detail / list-journal / search-issn）
          与 stdio 会话工具（login / logout）。机构认证使用用户自己配置的 CNKI
          Profile，不使用任何预设机构。
        order: 5
        plugins:
          # ------------------------------------------------------------------
          # Standard capabilities, copied verbatim from
          # @deepseek-ai/dsh-web-app/presets/standard.patch.yml (order 1).
          # ------------------------------------------------------------------
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # ------------------------------------------------------------------
          # CNKI additions (only inside this preset's scope).
          # ------------------------------------------------------------------
          # Skill catalog: inherits the project/DSH_HOME roots and adds the
          # installed bundle's own skills/ directory. The bundle is located
          # through the profile's module resolution, so the value follows
          # whatever directory the bundle was installed from.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js |-
                  (function () {
                    var path = process.getBuiltinModule('node:path');
                    var mod = process.getBuiltinModule('node:module');
                    var url = process.getBuiltinModule('node:url');
                    var dir = null;
                    try {
                      dir = path.dirname(mod.createRequire(baseUrl).resolve('@local/dsh-cnki-research/package.json'));
                    } catch (e) {}
                    if (!dir) {
                      try {
                        var base = String(baseUrl);
                        if (base.charAt(base.length - 1) !== '/') base += '/';
                        dir = url.fileURLToPath(new URL('node_modules/@local/dsh-cnki-research/', base));
                      } catch (e) {}
                    }
                    return dir ? path.join(dir, 'skills') : 'skills';
                  })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # The one MCP connection. stdio keeps CNKI in its own child process so
          # a browser crash cannot reach the Host or another session's Agent.
          - id: cnki-mcp
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: cnki
              transport: stdio
              # Resolved from <bundle>/portable.runtime.json (written by the
              # installer), then <packageRoot>/.venv, then PATH. Never a
              # hard-coded interpreter path.
              command: !!js |-
                (function () {
                  var path = process.getBuiltinModule('node:path');
                  var fs = process.getBuiltinModule('node:fs');
                  var mod = process.getBuiltinModule('node:module');
                  var dir = null;
                  try {
                    dir = path.dirname(mod.createRequire(baseUrl).resolve('@local/dsh-cnki-research/package.json'));
                  } catch (e) {}
                  var list = [];
                  try {
                    if (process.env.CNKI_RESEARCH_PYTHON) list.push(process.env.CNKI_RESEARCH_PYTHON);
                  } catch (e) {}
                  if (dir) {
                    try {
                      var cfg = JSON.parse(fs.readFileSync(path.join(dir, 'portable.runtime.json'), 'utf8'));
                      if (cfg && typeof cfg.python === 'string') list.push(cfg.python);
                    } catch (e) {}
                    var root = path.dirname(path.dirname(dir));
                    var near = path.dirname(dir);
                    list.push(path.join(root, '.venv', 'Scripts', 'python.exe'));
                    list.push(path.join(root, '.venv', 'bin', 'python'));
                    list.push(path.join(near, '.venv', 'Scripts', 'python.exe'));
                    list.push(path.join(near, '.venv', 'bin', 'python'));
                  }
                  for (var i = 0; i < list.length; i++) {
                    var candidate = list[i];
                    if (!candidate) continue;
                    try {
                      if (fs.existsSync(candidate)) return candidate;
                    } catch (e) {}
                  }
                  return process.platform === 'win32' ? 'python' : 'python3';
                })()
              args:
                - !!js |-
                  (function () {
                    var path = process.getBuiltinModule('node:path');
                    var mod = process.getBuiltinModule('node:module');
                    var url = process.getBuiltinModule('node:url');
                    var dir = null;
                    try {
                      dir = path.dirname(mod.createRequire(baseUrl).resolve('@local/dsh-cnki-research/package.json'));
                    } catch (e) {}
                    if (!dir) {
                      try {
                        var base = String(baseUrl);
                        if (base.charAt(base.length - 1) !== '/') base += '/';
                        dir = url.fileURLToPath(new URL('node_modules/@local/dsh-cnki-research/', base));
                      } catch (e) {}
                    }
                    return dir ? path.join(dir, 'launcher', 'cnki_research_launcher.py') : 'cnki_research_launcher.py';
                  })()
              # The launcher resolves `cnki_mcp` from the interpreter's own
              # site-packages, so any existing directory is correct. The bundle
              # directory keeps diagnostics and relative logs together.
              cwd: !!js |-
                (function () {
                  var path = process.getBuiltinModule('node:path');
                  var mod = process.getBuiltinModule('node:module');
                  var url = process.getBuiltinModule('node:url');
                  try {
                    return path.dirname(mod.createRequire(baseUrl).resolve('@local/dsh-cnki-research/package.json'));
                  } catch (e) {}
                  try {
                    var base = String(baseUrl);
                    if (base.charAt(base.length - 1) !== '/') base += '/';
                    return url.fileURLToPath(new URL('node_modules/@local/dsh-cnki-research/', base));
                  } catch (e) {}
                  return '.';
                })()
              # `login` may legitimately block for up to AUTH_TIMEOUT_SECONDS
              # (120 s) while a human completes institutional SSO or a CAPTCHA.
              toolCallTimeoutMs: 300000
              # A CNKI outage must never fail preset activation: degrade to "no
              # tools yet" and let the supervisor reconnect instead.
              failOnStartupError: false
              maxInstructionBytes: 32768
              reconnect:
                enabled: true
                initialDelayMs: 1000
                maxDelayMs: 30000
                maxAttempts: 20
